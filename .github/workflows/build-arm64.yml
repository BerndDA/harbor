name: Build Harbor arm64 images

# Builds Harbor images natively on a GitHub-hosted arm64 runner (free for public
# repositories) and pushes them to ghcr.io/<owner>/<image>.
#   images=registry (default, also on push): only registry-photon and harbor-registryctl,
#     the two images that carry our changes (distribution v3, web identity for S3).
#     All other images come from the official multi-arch goharbor/* release.
#   images=all: every service image plus the offline installer (workflow artifact).

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to ghcr.io"
        type: boolean
        default: true
      images:
        description: "Images to build"
        type: choice
        options: [registry, all]
        default: registry
  push:
    branches: [main]
    tags: ["v*"]
    paths: [".github/workflows/build-arm64.yml"]

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      ARCH: arm64
      BUILD_PACKAGE: "true"
      # push events have no inputs: build only the registry images
      IMAGES: ${{ inputs.images || 'registry' }}
      # same Trivy version as TRIVYVERSION in the Makefile; "latest" needs a GitHub API lookup that can fail
      TRIVY_CLI_VERSION: v0.76.1
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Compute tags
        id: meta
        run: |
          version=$(cat VERSION)
          short_sha=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${version}-${short_sha}"
          fi
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "Building Harbor ${tag} for arm64"

      - name: Build local photon base (arm64)
        run: docker build -f make/photon/common/Dockerfile -t goharbor/photon:5.0 .

      - name: Build registry images
        if: env.IMAGES == 'registry'
        run: |
          set -x
          sudo -E make versions_prepare compile_registryctl build \
            ARCH=arm64 \
            GOBUILDTAGS="include_oss include_gcs" \
            BASEIMAGETAG=dev \
            BUILD_BASE=true PULL_BASE_FROM_DOCKERHUB=false PUSHBASEIMAGE=false \
            BUILDTARGET="_build_registry _build_registryctl" \
            VERSIONTAG=${{ steps.meta.outputs.tag }} \
            HTTPPROXY=
          docker images | grep goharbor

      - name: Build images and offline installer
        if: env.IMAGES == 'all'
        run: |
          set -x
          sudo -E make package_offline \
            ARCH=arm64 \
            GOBUILDTAGS="include_oss include_gcs" \
            BASEIMAGETAG=dev \
            BUILD_BASE=true PULL_BASE_FROM_DOCKERHUB=false PUSHBASEIMAGE=false \
            VERSIONTAG=${{ steps.meta.outputs.tag }} \
            PKGVERSIONTAG=${{ steps.meta.outputs.tag }} \
            TRIVYFLAG=true EXPORTERFLAG=true HTTPPROXY=
          docker images | grep goharbor

      - name: Verify images are arm64
        run: |
          set -e
          tag=${{ steps.meta.outputs.tag }}
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^goharbor/' | grep -- ":${tag}$"); do
            arch=$(docker image inspect --format '{{.Architecture}}' "$img")
            echo "$img -> $arch"
            [ "$arch" = "arm64" ] || { echo "ERROR: $img is $arch"; exit 1; }
          done

      - name: Log in to ghcr.io
        if: github.event_name != 'workflow_dispatch' || inputs.push_images
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push images to ghcr.io
        if: github.event_name != 'workflow_dispatch' || inputs.push_images
        run: |
          set -e
          tag=${{ steps.meta.outputs.tag }}
          owner=${{ steps.meta.outputs.owner }}
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^goharbor/' | grep -- ":${tag}$"); do
            name=$(echo "$img" | cut -d/ -f2 | cut -d: -f1)
            for t in "${tag}" "latest-arm64"; do
              target="ghcr.io/${owner}/${name}:${t}"
              docker tag "$img" "$target"
              docker push "$target"
            done
            echo "- ghcr.io/${owner}/${name}:${tag}" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Scan images with Trivy
        # Report only: findings are listed in the job summary and do not fail the build.
        # Runs after the push, so a scanner problem never blocks the images.
        continue-on-error: true
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_CLI_VERSION }}

      - name: Run Trivy on built images
        continue-on-error: true
        run: |
          tag=${{ steps.meta.outputs.tag }}
          echo "## Trivy (HIGH/CRITICAL, fixed only)" >> "$GITHUB_STEP_SUMMARY"
          for img in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^goharbor/' | grep -- ":${tag}$"); do
            echo "### ${img}" >> "$GITHUB_STEP_SUMMARY"
            trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --format table "$img" >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Upload offline installer
        if: env.IMAGES == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: harbor-offline-installer-${{ steps.meta.outputs.tag }}-arm64
          path: harbor-offline-installer-*.tgz
          retention-days: 14
          compression-level: 0
